; /etc/llama-server/models.ini
; Modell-Presets für den Router-Modus von llama-server.
; Schlüssel = CLI-Flags ohne führende Striche. Reihenfolge der Priorität:
; CLI-Argumente > Abschnitt des Modells > [*]
;
; Der Abschnittsname ist der Modellname, den Clients im Feld "model" schicken.
; GGUF-Dateien nach /var/lib/llama-server/models legen und Pfade unten anpassen.

version = 1

[*]
; Gilt für alle Modelle.
c = 16384
; KV-Cache in 8 Bit: ~halber Speicher für den Kontext, praktisch ohne Qualitätsverlust.
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true

; ---------------------------------------------------------------------------
; Allrounder: MoE mit 3B aktiven Parametern, bestes Tempo pro Euro.
[qwen3.6-35b-a3b]
model = /var/lib/llama-server/models/Qwen3.6-35B-A3B-Q4_K_M.gguf
c = 32768
; Nur 12–16 GB VRAM? Experten-Gewichte der ersten N Schichten in den RAM legen.
; Wert per Messung suchen: so weit senken, bis der VRAM voll ist, dann +1.
; n-cpu-moe = 20
; MTP (Beta): nur mit einer GGUF, die die MTP-Köpfe enthält (siehe Modellkarte).
; spec-type = draft-mtp
; spec-draft-n-max = 3

; ---------------------------------------------------------------------------
; Sprachassistent (Home Assistant): schnell antworten, nicht lange „nachdenken“.
[ha-assist]
model = /var/lib/llama-server/models/gemma-4-26B-A4B-it-IQ4_XS.gguf
c = 16384
; 0 = Thinking sofort beenden. Spart Latenz und Strom bei kurzen Befehlen.
reasoning-budget = 0

; ---------------------------------------------------------------------------
; Programmieren / schwieriges Reasoning: dichtes 27B-Modell.
[qwen3.8-27b]
model = /var/lib/llama-server/models/Qwen3.8-27B-Q4_K_M.gguf
c = 32768
; spec-type = draft-mtp
; spec-draft-n-max = 3
